services:
  postgres:
    image: postgres:16-alpine
    container_name: strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - strapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strapi-app
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      NODE_ENV: ${NODE_ENV:-development}
      APP_KEYS: ${APP_KEYS:-defaultAppKey1,defaultAppKey2,defaultAppKey3,defaultAppKey4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-defaultApiTokenSalt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-defaultAdminJwtSecret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-defaultTransferTokenSalt}
      JWT_SECRET: ${JWT_SECRET:-defaultJwtSecret}
    volumes:
      - strapi_uploads:/app/public/uploads
    ports:
      - "${APP_PORT:-1337}:1337"
    networks:
      - strapi-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  strapi-network:
    driver: bridge
